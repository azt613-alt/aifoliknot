name: Manual Store Sync
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests lxml psycopg2-binary
      - run: python local_sync_stores.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
